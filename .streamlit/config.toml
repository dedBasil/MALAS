# The app shows applicant data and the audit log, so keep it on this machine only.
[server]
address = "127.0.0.1"
maxUploadSize = 10  # MB, matches "up to 10 MB" on the upload box

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
